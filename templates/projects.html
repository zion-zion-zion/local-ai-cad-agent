<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="projects.title">CAD 助手 — 项目</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="projects-page">
      <header class="projects-header">
        <div class="brand"><h1 data-i18n="projects.brand">CAD 助手</h1></div>
        <div class="projects-header-actions"><button id="language-toggle" type="button" class="language-toggle" aria-label="切换为英文" title="切换为英文">EN</button><button id="new-project-btn" class="primary" data-i18n="projects.new">新建项目</button></div>
      </header>

      <div id="new-project-modal" class="modal hidden">
        <div class="modal-content">
          <h3 data-i18n="projects.newTitle">新建项目</h3>
          <form id="new-project-form">
            <input id="new-project-name" type="text" data-i18n-placeholder="projects.namePlaceholder" placeholder="项目名称" required
                   pattern="[a-z0-9][a-z0-9-]{0,62}" autocomplete="off">
            <p class="hint" data-i18n="projects.nameHint">只能使用小写字母、数字和连字符。</p>
            <div class="modal-actions">
              <button type="button" id="cancel-new-project" class="quiet" data-i18n="common.cancel">取消</button>
              <button type="submit" data-i18n="common.create">创建</button>
            </div>
          </form>
        </div>
      </div>

      <div id="rename-modal" class="modal hidden">
        <div class="modal-content">
          <h3 data-i18n="projects.renameTitle">重命名项目</h3>
          <form id="rename-form">
            <input id="rename-name" type="text" data-i18n-placeholder="projects.newNamePlaceholder" placeholder="新名称" required
                   pattern="[a-z0-9][a-z0-9-]{0,62}" autocomplete="off">
            <p class="hint" data-i18n="projects.nameHint">只能使用小写字母、数字和连字符。</p>
            <div class="modal-actions">
              <button type="button" id="cancel-rename" class="quiet" data-i18n="common.cancel">取消</button>
              <button type="submit" data-i18n="common.rename">重命名</button>
            </div>
          </form>
        </div>
      </div>

      <div id="delete-confirm" class="modal hidden">
        <div class="modal-content">
          <h3 data-i18n="projects.deleteTitle">删除项目</h3>
          <p id="delete-confirm-text"></p>
          <div class="modal-actions">
            <button type="button" id="cancel-delete" class="quiet" data-i18n="common.cancel">取消</button>
            <button type="button" id="confirm-delete" class="danger" data-i18n="common.delete">删除</button>
          </div>
        </div>
      </div>

      <div id="projects-grid" class="projects-grid">
        <div class="empty-projects">
          <div class="empty-icon">◇</div>
          <h2 data-i18n="projects.emptyTitle">还没有项目</h2>
          <p data-i18n="projects.emptyText">创建你的第一个 CAD 项目开始使用。</p>
          <button id="empty-cta" class="primary" data-i18n="projects.getStarted">开始使用</button>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/projects.js') }}"></script>
  </body>
</html>
